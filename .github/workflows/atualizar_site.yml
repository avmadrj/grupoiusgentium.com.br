name: Automação Antigravity - Ius Gentium

# O fluxo será disparado:
# 1. Toda vez que você der um 'push' na pasta de documentos brutos
# 2. Toda segunda-feira às 09:00 UTC (6h da manhã no horário de Brasília)
on:
  push:
    paths:
      - 'documentos_brutos/**'
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch: # Permite rodar manualmente pelo painel do GitHub

permissions:
  contents: write

jobs:
  build-and-process:
    runs-on: ubuntu-latest

    steps:
    # 1. Baixa o código do repositório na máquina virtual
    - name: Checkout do Repositório
      uses: actions/checkout@v4

    # 2. Configura o ambiente Python estável
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    # 3. Instala a biblioteca oficial do Google AI
    - name: Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        pip install google-generativeai

    # 4. Executa o script Python passando a chave de API de forma segura
    - name: Rodar Processamento do Gemini 1.5 Pro
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python scripts/processar_dados.py

    # 5. Salva as alterações (os novos Markdowns) de volta no seu repositório
    - name: Commitar e Commitar Alterações
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add "site_producao/*.md"
        
        # Só commita se houver arquivos novos para evitar quebrar o fluxo
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Automação: Catálogo de Produção Atualizado via Gemini" && git push)